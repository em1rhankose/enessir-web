# Her gönderimde ve pull request'te: lint, tip kontrolü, testler ve canlı derleme.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: enessir
          POSTGRES_USER: enessir
          POSTGRES_PASSWORD: enessir
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enessir -d enessir"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://enessir:enessir@localhost:5432/enessir
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - name: Veritabanı migration'ları
        run: npm run migrate

      - name: Örnek içerik
        run: npm run seed

      - name: Birim ve erişim testleri
        run: npm run test:int

      - name: Canlı derleme
        run: npm run build

      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium

      - name: Uçtan uca testler
        run: npm run test:e2e

      - name: Playwright raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
