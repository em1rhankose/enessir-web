# Canlı ortam: site + PostgreSQL + Caddy (HTTPS) + gece yedeği.
# Kurulum ve güncelleme adımları için bkz. DEPLOY.md
#
#   docker compose -f docker-compose.prod.yml up -d db
#   docker compose -f docker-compose.prod.yml build app
#   docker compose -f docker-compose.prod.yml up -d

name: enessir

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enessir
      POSTGRES_USER: enessir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env dosyasında POSTGRES_PASSWORD tanımlı olmalı}
    ports:
      # Sadece sunucunun kendisinden erişilebilir (imaj derlenirken sayfaları üretmek için). İnternete kapalı.
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enessir -d enessir']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # Derleme sırasında veritabanına 127.0.0.1 üzerinden erişebilmek için.
      network: host
      secrets:
        - env
    image: enessir-web
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Yüklenen görseller kalıcı birimde; imaj yenilense de kaybolmaz.
      - media:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?.env dosyasında DOMAIN tanımlı olmalı}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ['sh', '/backup.sh']
    depends_on:
      db:
        condition: service_healthy

secrets:
  env:
    # Derleme sırasında okunan ayar dosyası (normalde .env; testte farklı bir dosya verilebilir).
    file: ${ENV_FILE:-.env}

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
