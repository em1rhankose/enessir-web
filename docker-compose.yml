# Geliştirme ortamı: sadece PostgreSQL. Site bilgisayarda `npm run dev` ile çalışır.
#   docker compose up -d     -> veritabanını başlatır
#   docker compose down      -> durdurur (veriler "pgdata" biriminde kalır)
# Canlı ortam için bkz. docker-compose.prod.yml ve DEPLOY.md

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enessir
      POSTGRES_USER: enessir
      POSTGRES_PASSWORD: enessir_dev
    ports:
      # Sadece bu bilgisayardan erişilebilir. 5433: bilgisayarda kurulu başka bir PostgreSQL (5432) ile çakışmasın.
      - '127.0.0.1:5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U enessir -d enessir']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
